<!DOCTYPE html>
<html lang="en" th:replace="~{base :: layout(~{::section})}">
<section>

    <div class="login-page">

        <div class="login-shell">

            <div class="login-brand">

                <div class="brand-glow"></div>

                <div class="brand-content">

                    <div class="brand-logo-wrap">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>

                    <h1 class="brand-title-lg">
                        Welcome back
                    </h1>

                    <p class="brand-text">
                        Sign in to manage your workspace, track your team and stay on top of everything that matters.
                    </p>

                    <div class="brand-points">

                        <div class="brand-point">
                            <i class="fa-solid fa-circle-check"></i>
                            <span>Secure role-based access</span>
                        </div>

                        <div class="brand-point">
                            <i class="fa-solid fa-circle-check"></i>
                            <span>Built for admins &amp; employees</span>
                        </div>

                        <div class="brand-point">
                            <i class="fa-solid fa-circle-check"></i>
                            <span>Fast, reliable, always available</span>
                        </div>

                    </div>

                </div>

            </div>

            <div class="login-form-panel">

                <div class="login-box">

                    <h2 class="login-title">
                        Login
                    </h2>

                    <p class="login-subtitle">
                        Enter your credentials to continue
                    </p>

                    <div class="alert alert-danger"
                         th:if="${error}"
                         th:text="${error}">
                    </div>

                    <form action="/login" method="post">

                        <div class="mb-3">
                            <label class="form-label">
                                User ID
                            </label>

                            <div class="input-with-icon">
                                <i class="fa-solid fa-user"></i>
                                <input type="text"
                                       name="userid"
                                       class="form-control"
                                       placeholder="Enter User ID"
                                       required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Password
                            </label>

                            <div class="input-with-icon">
                                <i class="fa-solid fa-lock"></i>
                                <input type="password"
                                       name="passwd"
                                       class="form-control"
                                       placeholder="Enter Password"
                                       required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                User Type
                            </label>

                            <select name="usertype"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select User Type
                                </option>

                                <option value="ADMIN">
                                    Admin
                                </option>

                                <option value="EMPLOYEE">
                                    Employee
                                </option>

                            </select>
                        </div>

                        <div class="d-grid">

                            <button type="submit"
                                    class="btn btn-primary login-btn">

                                Login
                                <i class="fa-solid fa-arrow-right"></i>

                            </button>

                        </div>

                    </form>

                    <div class="text-center mt-3">

                        <a th:href="@{/forgotpassword}">
                            Forgot Password?
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

</html>
