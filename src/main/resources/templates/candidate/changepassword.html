<!DOCTYPE html>
<html lang="en" th:replace="~{base :: layout(~{::section})}">

<section>

	<div class="container py-5">

		<div class="row justify-content-center">

			<div class="col-lg-6">

				<div class="card shadow-lg border-0 rounded-4">

					<div class="card-header bg-warning text-dark">

						<h3>

							<i class="fa-solid fa-key me-2"></i>

							Change Password

						</h3>

					</div>

					<div class="card-body">

						<div class="alert alert-success" th:if="${success}" th:text="${success}">
						</div>

						<div class="alert alert-danger" th:if="${error}" th:text="${error}">
						</div>

						<form th:action="@{/candidate/changepassword}" th:object="${passwordDto}" method="post">

							<div class="mb-3">

								<label class="form-label">

									Old Password

								</label>

								<input type="password" th:field="*{oldPassword}" class="form-control" required>

							</div>

							<div class="mb-3">

								<label class="form-label">

									New Password

								</label>

								<input type="password" th:field="*{newPassword}" class="form-control" required>

							</div>

							<div class="mb-4">

								<label class="form-label">

									Confirm Password

								</label>

								<input type="password" th:field="*{confirmPassword}" class="form-control" required>

							</div>

							<div class="text-center">

								<button class="btn btn-warning px-4">

									<i class="fa-solid fa-key me-2"></i>

									Change Password

								</button>

								<a th:href="@{/candidate/profile}" class="btn btn-secondary px-4">

									Cancel

								</a>

							</div>

						</form>

					</div>

				</div>

			</div>

		</div>

	</div>

</section>

</html>
