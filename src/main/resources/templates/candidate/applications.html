<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::section})}">

<section>

    <div class="container mt-5">

        <h2 class="text-center mb-4">My Applications</h2>

        <div class="card shadow p-4">

            <table id="applicationTable"
                   class="table table-bordered table-striped table-hover">

                <thead class="table-dark">
                    <tr>
                        <th>Application ID</th>
                        <th>Job ID</th>
                        <th>Job Profile</th>
                        <th>Candidate Name</th>
                        <th>Qualification</th>
                        <th>Status</th>
                        <th>Application Date</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="app : ${applications}">
                        <td th:text="${app.applicationid}"></td>
                        <td th:text="${app.jobid}"></td>
                        <td th:text="${app.jobprofile}"></td>
                        <td th:text="${app.candidateName}"></td>
                        <td th:text="${app.qualification}"></td>

                        <td>
                            <span class="badge bg-primary"
                                  th:text="${app.status}">
                            </span>
                        </td>

                        <td th:text="${app.applicationDate}"></td>
                    </tr>
                </tbody>

            </table>

        </div>

        <div class="text-center mt-3">
            <a th:href="@{/candidate/dashboard}"
               class="btn btn-secondary">
                Back
            </a>
        </div>

    </div>

    <link rel="stylesheet"
          href="https://cdn.datatables.net/2.0.8/css/dataTables.bootstrap5.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.js"></script>
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.bootstrap5.js"></script>

    <script>
        $(document).ready(function () {
            $('#applicationTable').DataTable();
        });
    </script>

</section>

</html>
