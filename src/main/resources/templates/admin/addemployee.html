<!DOCTYPE html>
<html lang="en" th:replace="~{base :: layout(~{::section})}">

<section>

<div class="addemp-page">

    <!-- HEADER BANNER -->
    <div class="addemp-banner mb-4">
        <div class="banner-glow"></div>
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="d-flex align-items-center gap-3">
                <div class="banner-icon">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <div>
                    <h2 class="fw-bold mb-1">Add Employee</h2>
                    <p class="mb-0 banner-subtitle">Register a new employee in HR Synergy</p>
                </div>
            </div>

            <a th:href="@{/admin/dashboard}" class="btn btn-back-dashboard">
                <i class="fa-solid fa-arrow-left me-2"></i>Back to Dashboard
            </a>
        </div>
    </div>

    <!-- ALERTS -->
    <div th:if="${success}" class="addemp-alert addemp-alert-success mb-4">
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${success}"></span>
    </div>

    <div th:if="${error}" class="addemp-alert addemp-alert-danger mb-4">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span th:text="${error}"></span>
    </div>

    <!-- FORM CARD -->
    <div class="addemp-card">

        <div class="addemp-card-header">
            <h4><i class="fa-solid fa-id-card-clip me-2"></i>Employee Registration Form</h4>
        </div>

        <!-- INFO PANEL -->
        <div class="addemp-info-panel mb-4">
            <i class="fa-solid fa-user-shield"></i>
            <span>Employee login credentials will be created using email and password.</span>
        </div>

        <form th:action="@{/admin/addemployee}" method="post" class="addemp-form">

            <div class="row g-4">

                <!-- Employee Name -->
                <div class="col-md-6">
                    <label class="form-label">Employee Name</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-user"></i>
                        <input type="text"
                               name="empname"
                               class="form-control"
                               placeholder="Enter employee name"
                               required>
                    </div>
                </div>

                <!-- Gender -->
                <div class="col-md-6">
                    <label class="form-label">Gender</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-venus-mars"></i>
                        <select name="gender" class="form-select" required>
                            <option value="">Select Gender</option>
                            <option value="MALE">Male</option>
                            <option value="FEMALE">Female</option>
                            <option value="OTHER">Other</option>
                        </select>
                    </div>
                </div>

                <!-- Father's Name -->
                <div class="col-md-6">
                    <label class="form-label">Father's Name</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-user-tie"></i>
                        <input type="text"
                               name="fname"
                               class="form-control"
                               placeholder="Enter father's name"
                               required>
                    </div>
                </div>

                <!-- Contact No -->
                <div class="col-md-6">
                    <label class="form-label">Contact No</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-phone"></i>
                        <input type="text"
                               name="contactno"
                               class="form-control"
                               placeholder="Enter contact number"
                               required>
                    </div>
                </div>

                <!-- Email Address -->
                <div class="col-md-6">
                    <label class="form-label">Email Address</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email"
                               name="emailaddress"
                               class="form-control"
                               placeholder="Enter email address"
                               required>
                    </div>
                </div>

                <!-- Password -->
                <div class="col-md-6">
                    <label class="form-label">Password</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password"
                               name="passwd"
                               class="form-control"
                               placeholder="Set login password"
                               required>
                    </div>
                </div>

                <!-- Department -->
                <div class="col-md-6">
                    <label class="form-label">Department</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-building"></i>
                        <input type="text"
                               name="department"
                               class="form-control"
                               placeholder="Enter department"
                               required>
                    </div>
                </div>

                <!-- Designation -->
                <div class="col-md-6">
                    <label class="form-label">Designation</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-briefcase"></i>
                        <input type="text"
                               name="designation"
                               class="form-control"
                               placeholder="Enter designation"
                               required>
                    </div>
                </div>

                <!-- Salary -->
                <div class="col-md-6">
                    <label class="form-label">Salary</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-money-check-dollar"></i>
                        <input type="number"
                               name="salary"
                               class="form-control"
                               placeholder="Enter salary"
                               step="0.01"
                               required>
                    </div>
                </div>

                <!-- Address 1 -->
                <div class="col-md-6">
                    <label class="form-label">Address 1</label>
                    <div class="input-icon-group textarea-icon-group">
                        <i class="fa-solid fa-location-dot"></i>
                        <textarea name="address1"
                                  class="form-control"
                                  rows="2"
                                  placeholder="Enter address line 1"
                                  required></textarea>
                    </div>
                </div>

                <!-- Address 2 -->
                <div class="col-md-6">
                    <label class="form-label">Address 2</label>
                    <div class="input-icon-group textarea-icon-group">
                        <i class="fa-solid fa-map-location-dot"></i>
                        <textarea name="address2"
                                  class="form-control"
                                  rows="2"
                                  placeholder="Enter address line 2"></textarea>
                    </div>
                </div>

            </div>

            <!-- FORM ACTIONS -->
            <div class="addemp-actions mt-4">
                <a th:href="@{/admin/dashboard}" class="btn btn-addemp-back">
                    <i class="fa-solid fa-arrow-left me-2"></i>Back
                </a>
                <button type="submit" class="btn btn-addemp-save">
                    <i class="fa-solid fa-floppy-disk me-2"></i>Save Employee
                </button>
            </div>

        </form>

    </div>

</div>

</section>

</html>
