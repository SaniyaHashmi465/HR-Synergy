<!DOCTYPE html>
<html lang="en" th:replace="~{base :: layout(~{::section})}">

<section>

<div class="addevent-page">

    <!-- HEADER BANNER -->
    <div class="addevent-banner mb-4">
        <div class="banner-glow"></div>
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="d-flex align-items-center gap-3">
                <div class="banner-icon">
                    <i class="fa-solid fa-calendar-plus"></i>
                </div>
                <div>
                    <h2 class="fw-bold mb-1">Add Event</h2>
                    <p class="mb-0 banner-subtitle">Create and publish a new company event</p>
                </div>
            </div>

            <a th:href="@{/admin/viewevents}" class="btn btn-back-events">
                <i class="fa-solid fa-arrow-left me-2"></i>Back to Events
            </a>
        </div>
    </div>

    <!-- SUCCESS ALERT -->
    <div th:if="${success}" class="addevent-alert-success mb-4">
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${success}"></span>
    </div>

    <div class="addevent-wrapper">

        <!-- FORM CARD -->
        <div class="addevent-card">

            <div class="addevent-card-header">
                <h4><i class="fa-solid fa-calendar-days me-2"></i>Event Details</h4>
            </div>

            <form th:action="@{/admin/addevent}" method="post" class="addevent-form">

                <!-- Event Title -->
                <div class="mb-4">
                    <label class="form-label">Event Title</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-heading"></i>
                        <input type="text"
                               name="eventtitle"
                               class="form-control"
                               placeholder="Enter event title"
                               required>
                    </div>
                </div>

                <!-- Event Date -->
                <div class="mb-4">
                    <label class="form-label">Event Date</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-calendar-day"></i>
                        <input type="date"
                               name="eventdate"
                               class="form-control"
                               required>
                    </div>
                </div>

                <!-- Event Description -->
                <div class="mb-4">
                    <label class="form-label">Event Description</label>
                    <div class="input-icon-group textarea-icon-group">
                        <i class="fa-solid fa-align-left"></i>
                        <textarea name="eventdescription"
                                  class="form-control"
                                  rows="5"
                                  placeholder="Describe the event details"
                                  required></textarea>
                    </div>
                </div>

                <!-- INFO PANEL -->
                <div class="addevent-info-panel mb-4">
                    <i class="fa-solid fa-bullhorn"></i>
                    <span>Events will be visible to employees after saving.</span>
                </div>

                <!-- FORM ACTIONS -->
                <div class="addevent-actions">
                    <a th:href="@{/admin/viewevents}" class="btn btn-addevent-back">
                        <i class="fa-solid fa-arrow-left me-2"></i>Back
                    </a>
                    <button type="submit" class="btn btn-addevent-save">
                        <i class="fa-solid fa-floppy-disk me-2"></i>Save Event
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>

</section>

</html>
