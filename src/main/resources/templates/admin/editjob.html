<!DOCTYPE html>
<html lang="en" th:replace="~{base :: layout(~{::section})}">

<section>

<div class="editjob-page">

    <!-- HEADER BANNER -->
    <div class="editjob-banner mb-4">
        <div class="banner-glow"></div>
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="d-flex align-items-center gap-3">
                <div class="banner-icon">
                    <i class="fa-solid fa-briefcase"></i>
                    <i class="fa-solid fa-pen banner-icon-badge"></i>
                </div>
                <div>
                    <h2 class="fw-bold mb-1">Edit Job</h2>
                    <p class="mb-0 banner-subtitle">Update recruitment details and job information</p>
                </div>
            </div>

            <a th:href="@{/admin/viewjobs}" class="btn btn-back-jobs">
                <i class="fa-solid fa-arrow-left me-2"></i>Back to Jobs
            </a>
        </div>
    </div>

    <!-- ALERTS (optional — show only if your controller sets these model attributes) -->
    <div th:if="${success}" class="editjob-alert editjob-alert-success mb-4">
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${success}"></span>
    </div>

    <div th:if="${error}" class="editjob-alert editjob-alert-danger mb-4">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span th:text="${error}"></span>
    </div>

    <div class="editjob-layout">

        <!-- FORM CARD (glassmorphism) -->
        <div class="editjob-card">

            <div class="editjob-card-header">
                <h4><i class="fa-solid fa-file-pen me-2"></i>Job Information Form</h4>
            </div>

            <form th:action="@{/admin/updatejob}" method="post" class="editjob-form">

                <input type="hidden" name="jobid" th:value="${job.jobid}">

                <div class="row g-4">

                    <!-- Job Profile -->
                    <div class="col-md-6">
                        <label class="form-label">Job Profile</label>
                        <div class="input-icon-group">
                            <i class="fa-solid fa-briefcase"></i>
                            <input type="text"
                                   name="jobprofile"
                                   class="form-control"
                                   th:value="${job.jobprofile}"
                                   placeholder="Enter job profile / title"
                                   required>
                        </div>
                    </div>

                    <!-- Vacancies -->
                    <div class="col-md-6">
                        <label class="form-label">Number of Vacancies</label>
                        <div class="input-icon-group">
                            <i class="fa-solid fa-users"></i>
                            <input type="number"
                                   name="noofvacancy"
                                   class="form-control"
                                   th:value="${job.noofvacancy}"
                                   placeholder="Enter number of vacancies"
                                   min="1"
                                   required>
                        </div>
                    </div>

                    <!-- Qualification -->
                    <div class="col-md-6">
                        <label class="form-label">Qualification</label>
                        <div class="input-icon-group">
                            <i class="fa-solid fa-graduation-cap"></i>
                            <input type="text"
                                   name="qualification"
                                   class="form-control"
                                   th:value="${job.qualification}"
                                   placeholder="Enter required qualification"
                                   required>
                        </div>
                    </div>

                    <!-- Experience -->
                    <div class="col-md-6">
                        <label class="form-label">Experience</label>
                        <div class="input-icon-group">
                            <i class="fa-solid fa-award"></i>
                            <input type="text"
                                   name="experience"
                                   class="form-control"
                                   th:value="${job.experience}"
                                   placeholder="Enter required experience"
                                   required>
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="col-12">
                        <label class="form-label">Job Description</label>
                        <div class="input-icon-group textarea-icon-group">
                            <i class="fa-solid fa-file-lines"></i>
                            <textarea name="description"
                                      class="form-control"
                                      rows="5"
                                      placeholder="Describe role, responsibilities and requirements"
                                      th:text="${job.description}"
                                      required></textarea>
                        </div>
                    </div>

                </div>

                <!-- FORM ACTIONS -->
                <div class="editjob-actions mt-4">
                    <a th:href="@{/admin/viewjobs}" class="btn btn-editjob-back ripple-btn">
                        <i class="fa-solid fa-arrow-left me-2"></i>Back
                    </a>
                    <button type="submit" class="btn btn-editjob-save ripple-btn">
                        <i class="fa-solid fa-floppy-disk me-2"></i>Update Job
                    </button>
                </div>

            </form>

        </div>

        <!-- INFO PANEL -->
        <aside class="editjob-info-card">
            <div class="editjob-info-icon">
                <i class="fa-solid fa-briefcase-clock"></i>
            </div>
            <h5>Heads up</h5>
            <p>Updating a job will immediately reflect on the careers page.</p>

            <ul class="editjob-info-list">
                <li><i class="fa-solid fa-check"></i> Recruitment Management</li>
                <li><i class="fa-solid fa-check"></i> Vacancy Tracking</li>
                <li><i class="fa-solid fa-check"></i> Candidate Applications</li>
            </ul>
        </aside>

    </div>

</div>

<script>
    // Simple click-ripple effect for buttons with .ripple-btn
    document.querySelectorAll('.ripple-btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
            var circle = document.createElement('span');
            circle.classList.add('ripple-circle');

            var rect = btn.getBoundingClientRect();
            var size = Math.max(rect.width, rect.height);

            circle.style.width = circle.style.height = size + 'px';
            circle.style.left = (e.clientX - rect.left - size / 2) + 'px';
            circle.style.top = (e.clientY - rect.top - size / 2) + 'px';

            btn.appendChild(circle);

            setTimeout(function () {
                circle.remove();
            }, 600);
        });
    });
</script>

</section>

</html>
