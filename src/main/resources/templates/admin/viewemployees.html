<!DOCTYPE html>
<html lang="en" th:replace="~{base :: layout(~{::section})}">

<section>

<div class="emplist-page">

    <!-- HEADER BANNER -->
    <div class="emplist-banner mb-4">
        <div class="banner-glow"></div>
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="d-flex align-items-center gap-3">
                <div class="banner-icon">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div>
                    <h2 class="fw-bold mb-1">Employee List</h2>
                    <p class="mb-0 banner-subtitle">Manage employee records, departments and designations</p>
                </div>
            </div>

            <div class="d-flex gap-2 flex-wrap">
                <a th:href="@{/admin/addemployee}" class="btn btn-add-employee">
                    <i class="fa-solid fa-user-plus me-2"></i>Add Employee
                </a>
                <a th:href="@{/admin/dashboard}" class="btn btn-back-dashboard">
                    <i class="fa-solid fa-arrow-left me-2"></i>Back to Dashboard
                </a>
            </div>
        </div>
    </div>

    <!-- ALERTS -->
    <div th:if="${success}" class="emplist-alert emplist-alert-success mb-4">
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${success}"></span>
    </div>

    <div th:if="${error}" class="emplist-alert emplist-alert-danger mb-4">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span th:text="${error}"></span>
    </div>

    <!-- SEARCH CARD -->
    <div class="emplist-search-card mb-4">
        <form th:action="@{/admin/searchemployee}" method="get" class="emplist-search-form">
            <div class="search-input-group">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text"
                       name="keyword"
                       class="form-control"
                       placeholder="Search by name, department, designation...">
            </div>

            <button type="submit" class="btn btn-emplist-search">
                <i class="fa-solid fa-magnifying-glass me-2"></i>Search
            </button>

            <a th:href="@{/admin/viewemployees}" class="btn btn-emplist-reset">
                <i class="fa-solid fa-rotate-left me-2"></i>View All
            </a>
        </form>
    </div>

    <!-- TABLE CARD -->
    <div class="emplist-table-panel">

        <div class="emplist-table-header">
            <h4><i class="fa-solid fa-table-list me-2"></i>Employee Records</h4>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle w-100">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Gender</th>
                        <th>Contact</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Designation</th>
                        <th>Salary</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="emp : ${employees}">
                        <td th:text="${emp.empid}"></td>
                        <td th:text="${emp.empname}"></td>
                        <td th:text="${emp.gender}"></td>
                        <td th:text="${emp.contactno}"></td>
                        <td class="email-cell" th:text="${emp.emailaddress}"></td>
                        <td th:text="${emp.department}"></td>
                        <td th:text="${emp.designation}"></td>
                        <td class="salary-cell" th:text="${emp.salary}"></td>
                        <td>
                            <div class="d-flex gap-2">
                                <a th:href="@{/admin/editemployee/{empid}(empid=${emp.empid})}"
                                   class="btn-action btn-edit">
                                    <i class="fa-solid fa-pen"></i> Edit
                                </a>
                                <a th:href="@{/admin/deleteemployees/{empid}(empid=${emp.empid})}"
                                   class="btn-action btn-delete"
                                   onclick="return confirm('Are you sure you want to delete this employee ?')">
                                    <i class="fa-solid fa-trash"></i> Delete
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</div>

</section>

</html>
