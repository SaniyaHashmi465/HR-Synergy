<!DOCTYPE html>
<html lang="en" th:replace="~{base :: layout(~{::section})}">

<div>
<section class="hs-fp-section">

    <!-- Font Awesome (safe to keep here if base template does not already include it) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{css/forgotpassword.css}" rel="stylesheet">

    <div class="hs-fp-wrap">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-9 col-lg-7 col-xl-5">

                    <div class="hs-fp-card fade-in-up">

                        <!-- Gradient Header -->
                        <div class="hs-fp-header">
                            <div class="hs-fp-pattern" aria-hidden="true"></div>
                            <div class="hs-fp-icon-wrap">
                                <i class="fa-solid fa-shield-halved"></i>
                            </div>
                            <h1>Forgot Password</h1>
                            <p>Reset your HR Synergy account password securely</p>
                        </div>

                        <div class="hs-fp-body">

                            <!-- Success Alert -->
                            <div th:if="${success}" class="hs-alert hs-alert-success" role="alert">
                                <i class="fa-solid fa-circle-check"></i>
                                <span th:text="${success}">Your password has been reset successfully!</span>
                            </div>

                            <!-- Error Alert -->
                            <div th:if="${error}" class="hs-alert hs-alert-error" role="alert">
                                <i class="fa-solid fa-triangle-exclamation"></i>
                                <span th:text="${error}">Something went wrong. Please try again.</span>
                            </div>

                            <form th:action="@{/forgotpassword}" method="post" class="hs-fp-form" novalidate>

                                <div class="hs-field">
                                    <i class="fa-solid fa-envelope hs-field-icon"></i>
                                    <input type="email" class="hs-input" id="emailaddress" name="emailaddress" placeholder=" " required>
                                    <label for="emailaddress">Registered Email Address</label>
                                </div>

                                <div class="hs-field">
                                    <i class="fa-solid fa-lock hs-field-icon"></i>
                                    <input type="password" class="hs-input" id="newPassword" name="newPassword" placeholder=" " required>
                                    <label for="newPassword">New Password</label>
                                    <button type="button" class="hs-toggle-pass" aria-label="Show password" tabindex="-1">
                                        <i class="fa-solid fa-eye"></i>
                                    </button>
                                </div>

                                <button type="submit" class="hs-btn-reset">
                                    <span>Reset Password</span>
                                    <i class="fa-solid fa-rotate-right"></i>
                                </button>

                                <a th:href="@{/login}" class="hs-btn-back-login">
                                    <i class="fa-solid fa-arrow-left"></i>
                                    <span>Back to Login</span>
                                </a>
                            </form>

                            <!-- Info Box -->
                            <div class="hs-info-note">
                                <i class="fa-solid fa-shield-halved"></i>
                                <p>Use your registered email address to reset your password. For your security, never share this link or your new password with anyone.</p>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script th:src="@{js/forgotpassword.js}"></script>
</section>
</div>
</html>
