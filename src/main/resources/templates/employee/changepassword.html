<!DOCTYPE html>
<html lang="en" th:replace="~{base :: layout(~{::section})}">

<section>

<div class="changepwd-page">

    <!-- HEADER BANNER -->
    <div class="changepwd-banner mb-4">
        <div class="banner-glow"></div>
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="d-flex align-items-center gap-3">
                <div class="banner-icon">
                    <i class="fa-solid fa-key"></i>
                </div>
                <div>
                    <h2 class="fw-bold mb-1">Change Password</h2>
                    <p class="mb-0 banner-subtitle">Update your account password securely</p>
                </div>
            </div>

            <a th:href="@{/employee/dashboard}" class="btn btn-back-dashboard">
                <i class="fa-solid fa-arrow-left me-2"></i>Back to Dashboard
            </a>
        </div>
    </div>

    <!-- ALERTS -->
    <div th:if="${success}" class="changepwd-alert changepwd-alert-success mb-4">
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${success}"></span>
    </div>

    <div th:if="${error}" class="changepwd-alert changepwd-alert-danger mb-4">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span th:text="${error}"></span>
    </div>

    <div class="changepwd-wrapper">

        <!-- FORM CARD -->
        <div class="changepwd-card">

            <div class="changepwd-card-header">
                <h4><i class="fa-solid fa-shield-halved me-2"></i>Security Verification</h4>
            </div>

            <!-- INFO PANEL -->
            <div class="changepwd-info-panel mb-4">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Use a strong password with letters, numbers and special characters.</span>
            </div>

            <form th:action="@{/employee/changepassword}" method="post" class="changepwd-form">

                <!-- Old Password -->
                <div class="mb-4">
                    <label class="form-label">Old Password</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password"
                               name="oldPassword"
                               id="oldPassword"
                               class="form-control"
                               placeholder="Enter your current password"
                               required>
                        <button type="button" class="pwd-toggle-btn" data-target="oldPassword" aria-label="Show or hide password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- New Password -->
                <div class="mb-4">
                    <label class="form-label">New Password</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-key"></i>
                        <input type="password"
                               name="newPassword"
                               id="newPassword"
                               class="form-control"
                               placeholder="Enter your new password"
                               required>
                        <button type="button" class="pwd-toggle-btn" data-target="newPassword" aria-label="Show or hide password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- FORM ACTIONS -->
                <div class="changepwd-actions">
                    <a th:href="@{/employee/dashboard}" class="btn btn-changepwd-back">
                        <i class="fa-solid fa-arrow-left me-2"></i>Back
                    </a>
                    <button type="submit" class="btn btn-changepwd-save">
                        <i class="fa-solid fa-key me-2"></i>Change Password
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>

<script>
    // Show/hide password toggle — purely visual, never touches input "name"
    document.querySelectorAll('.pwd-toggle-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var targetId = btn.getAttribute('data-target');
            var input = document.getElementById(targetId);
            var icon = btn.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
    });
</script>

</section>

</html>
