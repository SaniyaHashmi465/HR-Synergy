<!DOCTYPE html>
<html lang="en" th:replace="~{base :: layout(~{::section})}">

<section>

<!--
    DataTables CDN (Bootstrap 5 integration).
    Scoped to this page only — base.html's shared <head> is untouched.
    jQuery is included below since base.html's Bootstrap bundle.js does
    not include it, and DataTables requires jQuery.
-->
<link rel="stylesheet" href="https://cdn.datatables.net/2.3.8/css/dataTables.bootstrap5.min.css">

<div class="myleaves-page">

    <!-- HEADER BANNER -->
    <div class="myleaves-banner mb-4">
        <div class="banner-glow"></div>
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="d-flex align-items-center gap-3">
                <div class="banner-icon">
                    <i class="fa-solid fa-calendar-check"></i>
                </div>
                <div>
                    <h2 class="fw-bold mb-1">My Leave Requests</h2>
                    <p class="mb-0 banner-subtitle">Track your leave application status</p>
                </div>
            </div>

            <a th:href="@{/employee/dashboard}" class="btn btn-back-dashboard">
                <i class="fa-solid fa-arrow-left me-2"></i>Back to Dashboard
            </a>
        </div>
    </div>

    <!-- STATISTICS CARDS -->
    <div class="row g-4 mb-4">

        <div class="col-lg-3 col-md-6">
            <div class="myleaves-stat-card stat-total fade-in-up">
                <div class="myleaves-stat-icon"><i class="fa-solid fa-list-check"></i></div>
                <h3 id="statTotal">0</h3>
                <p>Total Leaves</p>
            </div>
        </div>

        <div class="col-lg-3 col-md-6">
            <div class="myleaves-stat-card stat-pending fade-in-up">
                <div class="myleaves-stat-icon"><i class="fa-solid fa-clock"></i></div>
                <h3 id="statPending">0</h3>
                <p>Pending</p>
            </div>
        </div>

        <div class="col-lg-3 col-md-6">
            <div class="myleaves-stat-card stat-approved fade-in-up">
                <div class="myleaves-stat-icon"><i class="fa-solid fa-circle-check"></i></div>
                <h3 id="statApproved">0</h3>
                <p>Approved</p>
            </div>
        </div>

        <div class="col-lg-3 col-md-6">
            <div class="myleaves-stat-card stat-rejected fade-in-up">
                <div class="myleaves-stat-icon"><i class="fa-solid fa-circle-xmark"></i></div>
                <h3 id="statRejected">0</h3>
                <p>Rejected</p>
            </div>
        </div>

    </div>

    <!-- TABLE CARD -->
    <div class="myleaves-table-panel">

        <div class="myleaves-table-header">
            <h4><i class="fa-solid fa-table-list me-2"></i>Leave History</h4>
        </div>

        <div class="table-responsive">
            <table id="leaveTable" class="table table-hover align-middle w-100">
                <thead>
                    <tr>
                        <th>Leave ID</th>
                        <th>From Date</th>
                        <th>To Date</th>
                        <th>Reason</th>
                        <th>Applied Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="leave : ${leaves}">
                        <td th:text="${leave.leaveid}"></td>
                        <td class="leave-date-cell" th:text="${leave.fromDate}"></td>
                        <td class="leave-date-cell" th:text="${leave.toDate}"></td>
                        <td class="leave-reason-cell">
                            <span class="desc-truncate" th:text="${leave.reason}"></span>
                        </td>
                        <td th:text="${leave.appliedDate}"></td>
                        <td>
                            <span th:if="${leave.status == 'PENDING'}" class="status-badge badge-pending">
                                <i class="fa-solid fa-clock"></i> Pending
                            </span>
                            <span th:if="${leave.status == 'APPROVED'}" class="status-badge badge-approved">
                                <i class="fa-solid fa-circle-check"></i> Approved
                            </span>
                            <span th:if="${leave.status == 'REJECTED'}" class="status-badge badge-rejected">
                                <i class="fa-solid fa-circle-xmark"></i> Rejected
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</div>

<!--
    jQuery + DataTables JS (Bootstrap 5 integration), plus the
    page-specific myleaves.js. Loaded at the end so they execute
    after the table markup above exists.
-->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.3.8/js/dataTables.min.js"></script>
<script src="https://cdn.datatables.net/2.3.8/js/dataTables.bootstrap5.min.js"></script>
<script th:src="@{/js/myleaves.js}"></script>

</section>

</html>
