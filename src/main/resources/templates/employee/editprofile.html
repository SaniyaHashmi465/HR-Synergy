<!DOCTYPE html>
<html lang="en" th:replace="~{base :: layout(~{::section})}">

<section>

<div class="editprofile-page">

    <!-- HEADER BANNER -->
    <div class="editprofile-banner mb-4">
        <div class="banner-glow"></div>
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="d-flex align-items-center gap-3">
                <div class="banner-icon">
                    <i class="fa-solid fa-user-pen"></i>
                </div>
                <div>
                    <h2 class="fw-bold mb-1">Edit Profile</h2>
                    <p class="mb-0 banner-subtitle">Update your personal and professional details</p>
                </div>
            </div>

            <a th:href="@{/employee/profile}" class="btn btn-back-profile">
                <i class="fa-solid fa-arrow-left me-2"></i>Back to Profile
            </a>
        </div>
    </div>

    <!-- PROTECTED FIELDS INFO PANEL -->
    <div class="editprofile-info-panel mb-4">
        <i class="fa-solid fa-shield-halved"></i>
        <span>Email and salary are protected and cannot be changed from this page.</span>
    </div>

    <!-- FORM CARD -->
    <div class="editprofile-card">

        <div class="editprofile-card-header">
            <h4><i class="fa-solid fa-id-card-clip me-2"></i>Profile Update Form</h4>
        </div>

        <form th:action="@{/employee/updateprofile}" method="post" class="editprofile-form">

            <input type="hidden" name="empid" th:value="${employee.empid}">
            <input type="hidden" name="passwd" th:value="${employee.passwd}">
            <input type="hidden" name="emailaddress" th:value="${employee.emailaddress}">
            <input type="hidden" name="salary" th:value="${employee.salary}">

            <div class="row g-4">

                <!-- Employee Name -->
                <div class="col-md-6">
                    <label class="form-label">Employee Name</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-user"></i>
                        <input type="text"
                               name="empname"
                               class="form-control"
                               th:value="${employee.empname}"
                               placeholder="Enter employee name"
                               required>
                    </div>
                </div>

                <!-- Gender -->
                <div class="col-md-6">
                    <label class="form-label">Gender</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-venus-mars"></i>
                        <select name="gender" class="form-select" required>
                            <option value="Male" th:selected="${employee.gender=='Male'}">Male</option>
                            <option value="Female" th:selected="${employee.gender=='Female'}">Female</option>
                            <option value="Other" th:selected="${employee.gender=='Other'}">Other</option>
                        </select>
                    </div>
                </div>

                <!-- Father Name -->
                <div class="col-md-6">
                    <label class="form-label">Father Name</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-user-tie"></i>
                        <input type="text"
                               name="fname"
                               class="form-control"
                               th:value="${employee.fname}"
                               placeholder="Enter father's name"
                               required>
                    </div>
                </div>

                <!-- Contact No -->
                <div class="col-md-6">
                    <label class="form-label">Contact No</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-phone"></i>
                        <input type="text"
                               name="contactno"
                               class="form-control"
                               th:value="${employee.contactno}"
                               placeholder="Enter contact number"
                               required>
                    </div>
                </div>

                <!-- Department -->
                <div class="col-md-6">
                    <label class="form-label">Department</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-building"></i>
                        <input type="text"
                               name="department"
                               class="form-control"
                               th:value="${employee.department}"
                               placeholder="Enter department"
                               required>
                    </div>
                </div>

                <!-- Designation -->
                <div class="col-md-6">
                    <label class="form-label">Designation</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-briefcase"></i>
                        <input type="text"
                               name="designation"
                               class="form-control"
                               th:value="${employee.designation}"
                               placeholder="Enter designation"
                               required>
                    </div>
                </div>

                <!-- Address 1 -->
                <div class="col-md-6">
                    <label class="form-label">Address 1</label>
                    <div class="input-icon-group textarea-icon-group">
                        <i class="fa-solid fa-location-dot"></i>
                        <textarea name="address1"
                                  class="form-control"
                                  rows="2"
                                  placeholder="Enter address line 1"
                                  th:text="${employee.address1}"
                                  required></textarea>
                    </div>
                </div>

                <!-- Address 2 -->
                <div class="col-md-6">
                    <label class="form-label">Address 2</label>
                    <div class="input-icon-group textarea-icon-group">
                        <i class="fa-solid fa-map-location-dot"></i>
                        <textarea name="address2"
                                  class="form-control"
                                  rows="2"
                                  placeholder="Enter address line 2"
                                  th:text="${employee.address2}"></textarea>
                    </div>
                </div>

            </div>

            <!-- FORM ACTIONS -->
            <div class="editprofile-actions mt-4">
                <a th:href="@{/employee/profile}" class="btn btn-editprofile-back">
                    <i class="fa-solid fa-arrow-left me-2"></i>Back
                </a>
                <button type="submit" class="btn btn-editprofile-save">
                    <i class="fa-solid fa-floppy-disk me-2"></i>Update Profile
                </button>
            </div>

        </form>

    </div>

</div>

</section>

</html>
