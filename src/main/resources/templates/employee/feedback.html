<!DOCTYPE html>
<html lang="en" th:replace="~{base :: layout(~{::section})}">

<section>

<div class="submitfb-page">

    <!-- HEADER BANNER -->
    <div class="submitfb-banner mb-4">
        <div class="banner-glow"></div>
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="d-flex align-items-center gap-3">
                <div class="banner-icon">
                    <i class="fa-solid fa-comments"></i>
                </div>
                <div>
                    <h2 class="fw-bold mb-1">Submit Feedback</h2>
                    <p class="mb-0 banner-subtitle">Share your feedback and help us improve HR services</p>
                </div>
            </div>

            <a th:href="@{/employee/dashboard}" class="btn btn-back-dashboard">
                <i class="fa-solid fa-arrow-left me-2"></i>Back to Dashboard
            </a>
        </div>
    </div>

    <!-- SUCCESS ALERT -->
    <div th:if="${success}" class="submitfb-alert-success mb-4">
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${success}"></span>
    </div>

    <div class="submitfb-wrapper">

        <!-- FORM CARD -->
        <div class="submitfb-card">

            <div class="submitfb-card-header">
                <h4><i class="fa-solid fa-comment-dots me-2"></i>Feedback Form</h4>
            </div>

            <!-- INFO PANEL -->
            <div class="submitfb-info-panel mb-4">
                <i class="fa-solid fa-lightbulb"></i>
                <span>Your feedback helps HR improve employee experience.</span>
            </div>

            <form th:action="@{/employee/feedback}" method="post" class="submitfb-form">

                <!-- Name -->
                <div class="mb-4">
                    <label class="form-label">Name</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-user"></i>
                        <input type="text"
                               name="name"
                               class="form-control"
                               placeholder="Enter your name"
                               required>
                    </div>
                </div>

                <!-- Email Address -->
                <div class="mb-4">
                    <label class="form-label">Email Address</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email"
                               name="emailaddress"
                               class="form-control"
                               placeholder="Enter your email address"
                               required>
                    </div>
                </div>

                <!-- Contact No -->
                <div class="mb-4">
                    <label class="form-label">Contact No</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-phone"></i>
                        <input type="text"
                               name="contactno"
                               class="form-control"
                               placeholder="Enter your contact number"
                               required>
                    </div>
                </div>

                <!-- Feedback Message -->
                <div class="mb-4">
                    <label class="form-label">Feedback Message</label>
                    <div class="input-icon-group textarea-icon-group">
                        <i class="fa-solid fa-comment-dots"></i>
                        <textarea name="feedbackmsg"
                                  class="form-control"
                                  rows="5"
                                  placeholder="Share your thoughts, suggestions or concerns"
                                  required></textarea>
                    </div>
                </div>

                <!-- FORM ACTIONS -->
                <div class="submitfb-actions">
                    <a th:href="@{/employee/dashboard}" class="btn btn-submitfb-back">
                        <i class="fa-solid fa-arrow-left me-2"></i>Back
                    </a>
                    <button type="submit" class="btn btn-submitfb-save">
                        <i class="fa-solid fa-paper-plane me-2"></i>Submit Feedback
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>

</section>

</html>
